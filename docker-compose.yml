services:
  backend:
    build:
      context: ./backend
      args:
        ENABLE_ML: ${ENABLE_ML:-false}
    env_file: .env
    ports: ["8000:8000"]
    restart: unless-stopped
  simulator:
    build: ./simulator
    env_file: .env
    environment:
      API_BASE_URL: ${API_BASE_URL:-https://agri-guard-api.onrender.com}
      SIMULATOR_INTERVAL_SECONDS: 5
    depends_on: [backend]
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_API_URL: ${VITE_API_URL}
    ports: ["5173:80"]
    depends_on: [backend]
    restart: unless-stopped
