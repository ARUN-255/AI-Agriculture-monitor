name: Frontend build
on:
  push:
    paths: ["frontend/**"]
  pull_request:
    paths: ["frontend/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: cd frontend && npm install
      - run: cd frontend && npm run build
